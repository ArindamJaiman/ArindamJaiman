name: Build profile assets

# Builds the neofetch card and contribution snake, then publishes both to the
# `output` branch, which the README loads them from. Replaces snake.yml.
on:
  # Runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allows manual trigger from the Actions tab
  workflow_dispatch:
  # Runs on every push to main
  push:
    branches:
      - main

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render neofetch card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/neofetch.py --user "$PROFILE_USER" --out dist

      # v3 takes colours as options on each output; `color_snake:` / `color_dots:`
      # inputs are silently ignored, which is why the old dark snake came out light.
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF41

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
