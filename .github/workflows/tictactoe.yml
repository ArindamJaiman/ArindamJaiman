name: "Tic-Tac-Toe"

on:
  issues:
    types: [opened]

# Prevent race conditions when multiple moves come in
concurrency:
  group: tictactoe-game
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt|')
    permissions:
      contents: write
      issues: write

    # Issue titles are attacker-controlled: they only ever reach the shell
    # through env vars, never through ${{ }} inside a run: script.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      EVENT_USER_LOGIN: ${{ github.event.issue.user.login }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: React to issue
        run: gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/reactions" -f content=eyes --silent || true

      - name: Run game engine
        run: python3 tictactoe/game.py

      - name: Commit and push
        run: |
          git config user.name "Tic-Tac-Toe Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Readme.md tictactoe/game_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🎮 ttt: $EVENT_USER_LOGIN — $ISSUE_TITLE"
          git pull --rebase origin main
          git push

      - name: Comment and close issue
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          ERROR_FILE="$RUNNER_TEMP/ttt_error.txt"
          if [ "$JOB_STATUS" != "success" ]; then
            MSG="💥 Something went wrong while recording that move. Give it another try in a minute."
          elif [ -f "$ERROR_FILE" ]; then
            MSG="⚠️ $(cat "$ERROR_FILE")"
          else
            MSG="✅ Move recorded!"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" \
            --body "@$EVENT_USER_LOGIN $MSG Check the board at https://github.com/$REPOSITORY 🎮"
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY"
